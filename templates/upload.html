<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Medicine Reminder AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:linear-gradient(135deg,#0ea5e9,#2563eb);

min-height:100vh;

display:flex;

justify-content:center;

align-items:center;

padding:40px;

}

.container{

width:900px;

background:white;

border-radius:20px;

box-shadow:0 20px 40px rgba(0,0,0,.2);

overflow:hidden;

animation:fade .8s;

}

@keyframes fade{

from{

opacity:0;

transform:translateY(25px);

}

to{

opacity:1;

transform:translateY(0);

}

}

.header{

background:#2563eb;

padding:30px;

text-align:center;

color:white;

}

.header h1{

font-size:34px;

}

.header p{

margin-top:10px;

opacity:.9;

}

form{

padding:35px;

}

.grid{

display:grid;

grid-template-columns:1fr 1fr;

gap:20px;

}

.full{

grid-column:1/3;

}

label{

font-weight:600;

display:block;

margin-bottom:8px;

color:#333;

}

label i{

color:#2563eb;

margin-right:8px;

}

input,select{

width:100%;

padding:12px;

border:1px solid #ccc;

border-radius:10px;

font-size:15px;

transition:.3s;

}

input:focus,

select:focus{

outline:none;

border-color:#2563eb;

box-shadow:0 0 10px rgba(37,99,235,.2);

}

input[type=file]{

padding:10px;

}

.submit{

margin-top:30px;

width:100%;

padding:16px;

background:linear-gradient(90deg,#2563eb,#0ea5e9);

border:none;

color:white;

font-size:18px;

font-weight:600;

border-radius:12px;

cursor:pointer;

transition:.3s;

}

.submit:hover{

transform:translateY(-3px);

box-shadow:0 8px 20px rgba(37,99,235,.3);

}

.note{

margin-top:25px;

text-align:center;

color:#666;

font-size:14px;

}

@media(max-width:768px){

.grid{

grid-template-columns:1fr;

}

.full{

grid-column:1;

}

.container{

width:100%;

}

}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>

<i class="fa-solid fa-heart-pulse"></i>

Medicine Reminder AI

</h1>

<p>

AI Prescription Reader & Medicine Adherence Prediction

</p>

</div>

<form action="/predict" method="POST" enctype="multipart/form-data">

<div class="grid">

<div class="full">

<label>

<i class="fa-solid fa-file-medical"></i>

Upload Prescription Image

</label>

<input
type="file"
name="image"
accept="image/*"
required>

</div>

<div>

<label>

<i class="fa-solid fa-user"></i>

Age

</label>

<input
type="number"
name="age"
placeholder="Enter Age"
required>

</div>

<div>

<label>

<i class="fa-solid fa-venus-mars"></i>

Gender

</label>

<select name="gender">

<option value="Male">Male</option>

<option value="Female">Female</option>

</select>

</div>

<div>

<label>

<i class="fa-solid fa-notes-medical"></i>

Chronic Disease

</label>

<select name="chronic_disease">

<option value="No">No</option>

<option value="Yes">Yes</option>

</select>

</div>

<div>

<label>

<i class="fa-solid fa-capsules"></i>

Doses Per Day

</label>

<input
type="number"
name="doses_per_day"
min="1"
placeholder="Example : 3"
required>

</div>

<div>

<label>

<i class="fa-solid fa-calendar-days"></i>

Treatment Days

</label>

<input
type="number"
name="treatment_days"
min="1"
placeholder="Example : 10"
required>

</div>

<div>

<label>

<i class="fa-solid fa-triangle-exclamation"></i>

Previous Missed Doses

</label>

<input
type="number"
name="previous_missed_doses"
min="0"
placeholder="Example : 2"
required>

</div>

<div>

<label>

<i class="fa-solid fa-bell"></i>

Reminder Used

</label>

<select name="reminder_used">

<option value="Yes">Yes</option>

<option value="No">No</option>

</select>

</div>

<div class="full">

<label>

<i class="fa-solid fa-clock"></i>

Reminder Time

</label>

<input
type="time"
name="reminder_time"
required>

</div>

</div>

<button class="submit" type="submit">

<i class="fa-solid fa-brain"></i>

Analyze Prescription & Predict Adherence

</button>

<div class="note">

Your prescription will be processed using OCR, medicines will be extracted, an adherence prediction will be generated, and a reminder can be scheduled.

</div>

</form>

</div>

</body>

</html>
